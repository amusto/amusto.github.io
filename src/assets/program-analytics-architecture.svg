<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="title desc">
  <title id="title">Program Analytics ETL Platform — Architecture</title>
  <desc id="desc">Vertical ETL flow: raw CSV sources are validated by Pydantic v2 (invalid and orphan rows route to a JSONL dead-letter sink), transformed into derived metrics (schedule variance, budget utilization, project health), loaded into PostgreSQL via idempotent UPSERTs, exposed through a FastAPI analytics service, and rendered by a React + TypeScript dashboard.</desc>

  <defs>
    <marker id="paarrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="paarrow-faint" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <style>
      .pa-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .pa-box-emph { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; }
      .pa-box-dlq { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; stroke-dasharray: 3,2; }
      .pa-label { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
      .pa-sublabel { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; font-size: 7.5px; }
      .pa-stage { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 7.5px; letter-spacing: 0.06em; text-transform: uppercase; }
      .pa-flow { stroke: #475569; stroke-width: 1.2; fill: none; }
      .pa-flow-dashed { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 3,2; fill: none; }
    </style>
  </defs>

  <!-- Raw CSV sources -->
  <rect class="pa-box" x="100" y="10" width="200" height="38" rx="4"/>
  <text class="pa-label" x="200" y="26" text-anchor="middle">data/raw/*.csv</text>
  <text class="pa-sublabel" x="200" y="38" text-anchor="middle">programs · projects · milestones · risks</text>

  <text class="pa-stage" x="312" y="62">extract</text>
  <line class="pa-flow" x1="200" y1="48" x2="200" y2="68" marker-end="url(#paarrow)"/>

  <!-- Pydantic validators -->
  <rect class="pa-box" x="100" y="70" width="200" height="38" rx="4"/>
  <text class="pa-label" x="200" y="86" text-anchor="middle">Pydantic v2 validators</text>
  <text class="pa-sublabel" x="200" y="98" text-anchor="middle">schema + business-rule checks</text>

  <!-- DLQ branch -->
  <path class="pa-flow-dashed" d="M 300 89 L 360 89" marker-end="url(#paarrow-faint)"/>
  <rect class="pa-box-dlq" x="305" y="105" width="90" height="34" rx="4"/>
  <text class="pa-label" x="350" y="120" text-anchor="middle">DLQ sink</text>
  <text class="pa-sublabel" x="350" y="131" text-anchor="middle">failed_records.jsonl</text>

  <text class="pa-stage" x="305" y="132">invalid + orphans</text>

  <text class="pa-stage" x="312" y="122">transform</text>
  <line class="pa-flow" x1="200" y1="108" x2="200" y2="128" marker-end="url(#paarrow)"/>

  <!-- Derived metrics -->
  <rect class="pa-box" x="100" y="130" width="200" height="50" rx="4"/>
  <text class="pa-label" x="200" y="146" text-anchor="middle">Derived metrics</text>
  <text class="pa-sublabel" x="200" y="158" text-anchor="middle">schedule_variance_days</text>
  <text class="pa-sublabel" x="200" y="168" text-anchor="middle">budget_utilization_pct · project_health</text>

  <text class="pa-stage" x="305" y="194">load (upsert)</text>
  <line class="pa-flow" x1="200" y1="180" x2="200" y2="200" marker-end="url(#paarrow)"/>

  <!-- PostgreSQL -->
  <rect class="pa-box-emph" x="80" y="202" width="240" height="78" rx="4"/>
  <text class="pa-label" x="200" y="218" text-anchor="middle">PostgreSQL 16</text>
  <text class="pa-sublabel" x="200" y="232" text-anchor="middle">programs · projects · milestones · risks</text>
  <text class="pa-sublabel" x="200" y="244" text-anchor="middle">project_analytics  (derived rollup)</text>
  <text class="pa-sublabel" x="200" y="256" text-anchor="middle">etl_run_log  (lineage / audit)</text>
  <text class="pa-sublabel" x="200" y="270" text-anchor="middle" style="font-style: italic;">ON CONFLICT DO UPDATE — idempotent</text>

  <text class="pa-stage" x="305" y="294">SQL</text>
  <line class="pa-flow" x1="200" y1="280" x2="200" y2="300" marker-end="url(#paarrow)"/>

  <!-- FastAPI -->
  <rect class="pa-box" x="80" y="302" width="240" height="78" rx="4"/>
  <text class="pa-label" x="200" y="318" text-anchor="middle">FastAPI analytics service</text>
  <text class="pa-sublabel" x="200" y="332" text-anchor="middle">/analytics/summary</text>
  <text class="pa-sublabel" x="200" y="344" text-anchor="middle">/analytics/programs</text>
  <text class="pa-sublabel" x="200" y="356" text-anchor="middle">/analytics/projects/at-risk</text>
  <text class="pa-sublabel" x="200" y="368" text-anchor="middle">/projects/{id}  ·  /etl/run</text>

  <text class="pa-stage" x="305" y="394">HTTP / JSON</text>
  <line class="pa-flow" x1="200" y1="380" x2="200" y2="400" marker-end="url(#paarrow)"/>

  <!-- React UI -->
  <rect class="pa-box" x="100" y="402" width="200" height="50" rx="4"/>
  <text class="pa-label" x="200" y="418" text-anchor="middle">React + TypeScript UI</text>
  <text class="pa-sublabel" x="200" y="430" text-anchor="middle">KPI cards · at-risk table</text>
  <text class="pa-sublabel" x="200" y="442" text-anchor="middle">program rollup</text>
</svg>
